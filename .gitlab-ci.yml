workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate

default:
  image: node:24.19.0-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

variables:
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  NPM_CONFIG_PREFER_OFFLINE: 'true'

quality:
  stage: validate
  script:
    - node --version
    - npm --version
    - apt-get update
    - apt-get install --yes --no-install-recommends gjs
    - npm ci
    - npm run check
  coverage: '/all files\s+\|\s+(\d+(?:\.\d+)?)/'
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
