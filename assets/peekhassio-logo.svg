<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Peekhassio logo</title>
  <desc id="description">A simplified cubist gnome wearing goggles with Home Assistant symbols.</desc>

  <defs>
    <symbol id="home-assistant" viewBox="0 0 64 64">
