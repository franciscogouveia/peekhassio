<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Peekhassio logo</title>
  <desc id="description">A gnome with a curled mustache and goggles containing Home Assistant symbols.</desc>

  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b3e"/>
      <stop offset="1" stop-color="#c91f2b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0ac"/>
      <stop offset="1" stop-color="#ee916c"/>
    </linearGradient>
    <symbol id="home-assistant" viewBox="0 0 64 64">
      <path fill="#fff" d="M7 29 32 7l25 22v27H7Z"/>
      <path fill="none" stroke="#18b7df" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"
