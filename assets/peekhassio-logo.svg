  <path fill="#ff6257" d="M170 145c24-50 57-83 100-103-29 33-52 70-69 111Z" opacity=".75"/>
  <path fill="#b41625" d="M288 79c39 27 68 66 84 118-32-17-68-28-106-34 28-12 35-40 22-84Z" opacity=".65"/>
  <path fill="url(#hat)" stroke="#172532" stroke-linejoin="round" stroke-width="11"
