      <circle cx="32" cy="18" r="4" fill="#18b7df"/>
      <circle cx="20" cy="26" r="4" fill="#18b7df"/>
      <circle cx="45" cy="32" r="4" fill="#18b7df"/>
    </symbol>
  </defs>

  <rect width="512" height="512" rx="72" fill="#faf7ef"/>

