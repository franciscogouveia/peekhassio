name: Tagged release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install GNOME tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs gnome-shell unzip

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Create checksum
        run: sha256sum peekhassio@de-gouveia.eu.shell-extension.zip > peekhassio@de-gouveia.eu.shell-extension.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive=peekhassio@de-gouveia.eu.shell-extension.zip
          checksum="$archive.sha256"
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$archive" "$checksum" --clobber
          else
              gh release create "$tag" "$archive" "$checksum" \
                  --verify-tag \
                  --generate-notes \
                  --title "Peekhassio ${tag#v}"
          fi
